          find project -maxdepth 6 -type f | sort

      - name: Build debug APK
        shell: bash
        run: |
          cd project
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify and rename APK
        shell: bash
        run: |
          test -f project/app/build/outputs/apk/debug/app-debug.apk
          cp project/app/build/outputs/apk/debug/app-debug.apk HAKON-NFC-Helper.apk
          ls -lh HAKON-NFC-Helper.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAKON-NFC-Helper-APK
          path: HAKON-NFC-Helper.apk
          if-no-files-found: error
