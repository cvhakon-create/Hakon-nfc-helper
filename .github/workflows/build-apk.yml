      - name: Build APK
        shell: bash
        run: |
          cd project
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk HAKON-Attendance-AllInOne.apk
          ls -lh HAKON-Attendance-AllInOne.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAKON-Attendance-AllInOne-APK
          path: HAKON-Attendance-AllInOne.apk
          if-no-files-found: error
