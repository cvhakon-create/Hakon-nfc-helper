      - name: Build APK
        shell: bash
        run: |
          cd project
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk HAKON-Attendance-v24.apk
          ls -lh HAKON-Attendance-v24.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAKON-Attendance-v24-APK
          path: HAKON-Attendance-v24.apk
          if-no-files-found: error
